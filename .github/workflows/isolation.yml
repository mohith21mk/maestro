name: Repository Isolation Guardrail

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify-isolation:
    name: Verify Project Isolation & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Run Project Isolation Validation
        run: npm run verify:isolation

      - name: Build Frontend (with prebuild isolation guard)
        run: npm run build

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest

      - name: Run Backend Isolation & Unit Tests
        run: |
          pytest backend/tests/test_isolation.py -v
